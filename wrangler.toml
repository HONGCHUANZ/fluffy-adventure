name = "content-monitor"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages configuration
main = ".open-next/worker.js"

# For Cloudflare Pages, environment variables are set via the dashboard:
# https://dash.cloudflare.com -> Pages -> Your project -> Settings -> Environment variables
#
# Required variables:
# - TURSO_DATABASE_URL: Your Turso database URL (e.g., libsql://your-db.turso.io)
# - TURSO_AUTH_TOKEN: Your Turso auth token
# - MINIMAX_API_KEY: Your MiniMax API key
